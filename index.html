<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enfoque</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4772fa">
<style>
:root{--bg:#fff;--side:#f7f7f9;--rail:#f0f1f4;--tx:#1f2329;--mu:#8b9099;--ac:#4772fa;--ach:#4772fa1a;--br:#e8e9ec;--hv:#f1f2f6;--rd:#d93a32;--am:#f09f1d;--ok:#2fb344;--inp:#f3f4f7}
:root[data-t=dark]{--bg:#1d1d20;--side:#232327;--rail:#19191c;--tx:#e6e7ea;--mu:#8e9097;--br:#34353a;--hv:#2b2b30;--inp:#2a2a2f;--ach:#4772fa30}
@media(prefers-color-scheme:dark){:root[data-t=auto]{--bg:#1d1d20;--side:#232327;--rail:#19191c;--tx:#e6e7ea;--mu:#8e9097;--br:#34353a;--hv:#2b2b30;--inp:#2a2a2f;--ach:#4772fa30}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--inp);border:1px solid transparent;border-radius:8px;padding:8px 10px;width:100%;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:none}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--mu);padding:6px 8px}button.g:hover{background:var(--hv)}
button.o{background:var(--inp);color:var(--tx)}
button.d{background:var(--rd)}
svg{display:block}
input[type=range]{padding:0;accent-color:var(--ac);height:28px}
button.rec{background:var(--rd)!important;color:#fff!important}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
#rem{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.remc{background:var(--bg);color:var(--tx);border:1px solid var(--ac);border-radius:12px;padding:12px 14px;box-shadow:0 8px 30px #0005;display:flex;flex-direction:column;gap:2px}
.remc small{color:var(--mu)}
#app{display:grid;grid-template-columns:56px 240px minmax(0,1fr) 370px;height:100vh}
#app.nolist{grid-template-columns:56px minmax(0,1fr)}
#app.nolist #side,#app.nolist #detail{display:none}
/* barra de iconos */
#rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-right:1px solid var(--br)}
#rail .av{width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:10px}
#rail .ri{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer}
#rail .ri:hover{background:var(--hv)}#rail .ri.on{color:var(--ac);background:var(--ach)}
#rail .sp{flex:1}
/* panel de listas */
#side{background:var(--side);border-right:1px solid var(--br);overflow:auto;padding:10px 8px}
.nv{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;cursor:pointer;color:var(--tx)}
.nv:hover{background:var(--hv)}.nv.on{background:var(--ach);color:var(--ac)}
.nv svg{color:var(--mu);flex:none}.nv.on svg{color:var(--ac)}
.nv .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nv .c{font-size:12px;color:var(--mu)}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;color:var(--mu);font-size:12px;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
/* lista de tareas */
#main{overflow:auto;height:100vh;min-width:0}
.pad{padding:18px 22px 40px;max-width:900px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h1{font-size:20px;font-weight:700;flex:1}
.hd .menu{display:none}
.addbar{display:flex;align-items:center;gap:8px;background:var(--inp);border-radius:10px;padding:2px 8px 2px 12px;margin-bottom:10px;border:1px solid transparent}
.addbar:focus-within{border-color:var(--ac);background:var(--bg)}
.addbar svg{color:var(--mu)}
.addbar #nt{background:transparent;border:0;padding:10px 4px;flex:1}
.addbar select,.addbar input[type=date]{width:auto;background:transparent;padding:5px;font-size:12px;color:var(--mu)}
.gh{display:flex;align-items:center;gap:6px;padding:10px 4px 4px;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;user-select:none}
.gh .car{transition:.15s}.gh.cl .car{transform:rotate(-90deg)}
.gh.late{color:var(--rd)}
.tr{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid transparent}
.tr:hover{background:var(--hv)}.tr.sel{background:var(--ach)}
.tr .ttl{flex:1;min-width:0;overflow-wrap:anywhere}
.tr.dn .ttl{color:var(--mu);text-decoration:line-through}
.tr .mt{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu);flex:none;margin-top:1px}
.tr .tg{color:var(--ac)}
.dt.late{color:var(--rd)}.dt.today{color:var(--ac)}.dt.tom{color:var(--am)}
.cb{width:17px;height:17px;border:2px solid #a9adb5;border-radius:4px;flex:none;position:relative;cursor:pointer;margin-top:1px}
.cb.p3{border-color:var(--rd);background:#d93a3218}.cb.p2{border-color:var(--am);background:#f09f1d18}.cb.p1{border-color:var(--ac);background:#4772fa18}
.cb.on{background:#a9adb5;border-color:#a9adb5}
.cb.on::after{content:'';position:absolute;left:4px;top:0;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.empty{text-align:center;color:var(--mu);padding:60px 10px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
/* detalle */
#detail{border-left:1px solid var(--br);overflow:auto;padding:16px 18px}
.dh{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--br);margin-bottom:12px;flex-wrap:wrap}
.dh select,.dh input[type=date]{width:auto;background:var(--inp);font-size:12px;padding:5px 8px}
#et{font-size:18px;font-weight:600;background:transparent;padding:6px 0;border-radius:0;border-width:0}
#en{background:transparent;padding:6px 0;min-height:110px;border-width:0;border-radius:0}
.sub{display:flex;gap:10px;align-items:center;padding:5px 0}
.sub .cb{width:15px;height:15px}.sub span{flex:1}.sub.dn span{color:var(--mu);text-decoration:line-through}
.df{display:flex;gap:8px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--br);flex-wrap:wrap}
.df select{width:auto;max-width:140px}.df input{flex:1;min-width:100px}
.ph{color:var(--mu);text-align:center;margin-top:30vh}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:30;padding:14px}
#modal.on{display:flex}
#modal .box{background:var(--bg);border-radius:14px;padding:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
/* otras vistas */
.card{border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:14px;background:var(--bg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.f{flex:1;min-width:110px}
label.l{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--mu);padding:4px}
.cal .d{min-height:78px;border:1px solid var(--br);border-radius:8px;padding:5px;cursor:pointer;font-size:12px;overflow:hidden}
.cal .d:hover{background:var(--hv)}.cal .d.out{opacity:.4}.cal .d.td b{background:var(--ac);color:#fff;border-radius:50%;padding:1px 6px}.cal .d.sel{background:var(--ach)}
.cal .d i{display:block;font-style:normal;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;margin-top:2px;background:var(--ach);color:var(--ac)}
.clock{font-size:84px;font-weight:300;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modes button{background:var(--inp);color:var(--mu)}.modes button.on{background:var(--ac);color:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.grid3 b{display:block;font-size:26px;color:var(--ac)}.grid3 small{color:var(--mu)}
.bars{display:flex;gap:8px;height:150px;align-items:flex-end}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.bars .u{width:100%;border-radius:6px 6px 0 0;min-height:2px}.bars small{font-size:11px;color:var(--mu)}.bars .v{font-size:11px}
.week{display:flex;gap:4px;flex-wrap:wrap}
.week i{width:26px;height:26px;border-radius:7px;background:var(--inp);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal;color:var(--mu)}
.week i.on{background:var(--ok);color:#fff}
.hn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
@media(max-width:1099px){#app{grid-template-columns:56px 230px minmax(0,1fr)}#detail{display:none!important}}
@media(max-width:760px){
 #app,#app.nolist{grid-template-columns:1fr;padding-bottom:58px}
 #rail{position:fixed;bottom:0;left:0;right:0;height:58px;flex-direction:row;justify-content:space-around;padding:0 6px;border-right:0;border-top:1px solid var(--br);z-index:20}
 #rail .av,#rail .sp{display:none}
 #side{position:fixed;left:0;top:0;bottom:58px;width:260px;z-index:25;transform:translateX(-100%);transition:.2s;display:block!important}
 #side.open{transform:none;box-shadow:0 0 40px #0006}
 #app.nolist #side{display:block!important}
 .hd .menu{display:block}.pad{padding:14px}.clock{font-size:64px}
 .cal .d{min-height:50px}.cal .d i{display:none}.tr .mt .lst{display:none}
 #main{height:calc(100vh - 58px)}
 .addbar{flex-wrap:wrap}.addbar #nt,.addbar #cn,.addbar #hn,.addbar #sn{flex:1 1 calc(100% - 40px);min-width:0}
 .addbar select,.addbar input[type=date]{flex:1}
 .addbar button{flex:none}
}
</style>
</head>
<body>
<div id="app"><nav id="rail"></nav><aside id="side"></aside><main id="main"></main><section id="detail"></section></div>
<div id="modal"></div>

<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='enfoque2';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const DEF=()=>({lists:[{id:'inbox',name:'Bandeja',color:'#4772fa'}],tasks:[],habits:[],sess:[],timer:null,
 templates:[
  {id:'tp1',name:'Maleta de viaje',items:['Documentos y pasaporte','Cargador del celular','Ropa interior','Ropa para cada día','Artículos de aseo','Medicinas','Dinero y tarjetas','Audífonos']},
  {id:'tp2',name:'Rutina de la mañana',items:['Tomar agua','Estirarme 5 minutos','Ducharme','Desayunar','Revisar mi agenda del día']}],
 theme:'auto',cfg:{work:25,short:5,long:15}});
let S;try{S=Object.assign(DEF(),JSON.parse(localStorage.getItem(KEY)))}catch{S=DEF()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const DOW=['L','M','X','J','V','S','D'];
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const label=s=>{const t=today();if(s===t)return'Hoy';if(s===addDays(t,1))return'Mañana';if(s===addDays(t,-1))return'Ayer';const d=pd(s);return d.getDate()+' '+MES[d.getMonth()].slice(0,3).toLowerCase()};
const listOf=id=>S.lists.find(l=>l.id===id)||S.lists[0];
const PN=['Sin prioridad','Prioridad baja','Prioridad media','Prioridad alta'];

const IC={
 today:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 tom:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M10 16h5m-2-2.5l2.5 2.5-2.5 2.5"/>',
 week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17.5h2M11 17.5h2"/>',
 all:'<path d="M4 6h16M4 12h16M4 18h10"/>',
 tasks:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 12.5l3 3 5-6"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 focus:'<circle cx="12" cy="13.5" r="8"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5"/>',
 habit:'<path d="M12 3c3 4 6 6 6 10a6 6 0 01-12 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3 0-6 2-9z"/>',
 stats:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
 car:'<path d="M6 9l6 6 6-6"/>',
 tag:'<path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1"/>',
 tpl:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>'
};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;

const OTHER=['cal','foco','hab','stats'];
const isTV=()=>!OTHER.includes(ui.view);
let ui={view:'hoy',lastTV:'hoy',collapsed:{},showDone:false,sel:null,edit:null,drawer:false,cal:{y:new Date().getFullYear(),m:new Date().getMonth(),sel:today()}};
const wide=()=>matchMedia('(min-width:1100px)').matches;

// ---------- lógica
function nextDue(due,rep){
 let d=pd(due);
 if(rep==='d')d.setDate(d.getDate()+1);
 else if(rep==='w')d.setDate(d.getDate()+7);
 else if(rep==='wd'){do d.setDate(d.getDate()+1);while(d.getDay()%6===0)}
 else if(rep==='m')d.setMonth(d.getMonth()+1);
 else if(rep==='y')d.setFullYear(d.getFullYear()+1);
 return ds(d);
}
function toggle(t){
 if(!t.done){
  t.done=true;t.doneAt=today();
  if(t.rep)S.tasks.push({...t,id:uid(),done:false,doneAt:null,pomos:0,spentS:0,remDone:false,snz:0,due:nextDue(t.due||today(),t.rep),subs:t.subs.map(s=>({...s,done:false}))});
 }else{t.done=false;t.doneAt=null}
}
function addTask(raw,o){
 let txt=raw.trim();if(!txt)return false;
 const tags=[];txt=txt.replace(/(^|\s)#([\p{L}\d_-]+)/gu,(m,a,w)=>{tags.push(w);return a}).trim();
 let due=o.due||'',time='';
 {const P=[/\s+a las?\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?(?:\s+de la\s+(tarde|noche|mañana|madrugada))?$/i,/\s+(\d{1,2}):(\d{2})\s*(am|pm)?$/i,/\s+(\d{1,2})\s*(am|pm)$/i];
  for(let i=0;i<3&&!time;i++){const m=txt.match(P[i]);if(!m)continue;
   let h=+m[1];const mi=i<2?+(m[2]||0):0,mer=((i===0?(m[3]||m[4]):i===1?m[3]:m[2])||'').toLowerCase();
   if(/pm|tarde|noche/.test(mer)&&h<12)h+=12;else if(/^(am|mañana|madrugada)$/.test(mer)&&h===12)h=0;
   if(h<24&&mi<60){time=pad(h)+':'+pad(mi);txt=txt.slice(0,m.index).trim()}}}
 if(/\s(hoy)$/i.test(txt)){due=today();txt=txt.replace(/\s+hoy$/i,'')}
 else if(/\s(mañana)$/i.test(txt)){due=addDays(today(),1);txt=txt.replace(/\s+mañana$/i,'')}
 txt=txt.trim();if(!txt)return false;
 if(time&&!due)due=today();
 const x={id:uid(),t:txt,notes:'',list:o.list||'inbox',tags,p:+o.p||0,due,rep:'',done:false,doneAt:null,subs:[],pomos:0,est:0,spentS:0,time,rem:time?0:-1,remDone:false,snz:0};
 if(time){armRem(x);askNotif()}
 S.tasks.push(x);save();return x;
}
function filterFor(v){
 const t=today(),w=addDays(t,7);
 if(v==='hoy')return x=>x.due&&x.due<=t;
 if(v==='man')return x=>x.due===addDays(t,1);
 if(v==='prox')return x=>x.due&&x.due>=t&&x.due<=w;
 if(v.startsWith('list:'))return x=>x.list===v.slice(5);
 if(v.startsWith('tag:'))return x=>x.tags.includes(v.slice(4));
 return()=>true;
}
function groups(open){
 const t=today(),tm=addDays(t,1),w=addDays(t,7);
 return [['Vencidas',x=>x.due&&x.due<t,'late'],['Hoy',x=>x.due===t],['Mañana',x=>x.due===tm],['Próximos 7 días',x=>x.due>tm&&x.due<=w],['Más adelante',x=>x.due>w],['Sin fecha',x=>!x.due]]
  .map(([n,f,c])=>({n,c,items:open.filter(f)})).filter(g=>g.items.length);
}
const sortT=(a,b)=>(a.due||'9').localeCompare(b.due||'9')||(a.time||'99').localeCompare(b.time||'99')||b.p-a.p;

// ---------- barra de iconos y panel
function renderRail(){
 const it=(id,i,t,on)=>`<div class="ri ${on?'on':''}" title="${t}" data-act="rail" data-v="${id}">${ic(i,22)}</div>`;
 $('#rail').innerHTML=`<div class="av">E</div>${it('tasks','tasks','Tareas',isTV())}${it('cal','cal','Calendario',ui.view==='cal')}${it('foco','focus','Foco',ui.view==='foco')}${it('hab','habit','Hábitos',ui.view==='hab')}${it('stats','stats','Estadísticas',ui.view==='stats')}<div class="sp"></div><div class="ri" title="Ajustes" data-act="settings">${ic('gear',22)}</div>`;
}
function renderSide(){
 const t=today(),open=S.tasks.filter(x=>!x.done);
 const c={hoy:open.filter(filterFor('hoy')).length,man:open.filter(filterFor('man')).length,prox:open.filter(filterFor('prox')).length,todas:open.length};
 const nav=(id,i,name,n)=>`<div class="nv ${ui.view===id?'on':''}" data-act="nav" data-v="${id}">${ic(i)}<span class="n">${name}</span><span class="c">${n||''}</span></div>`;
 const tags=[...new Set(S.tasks.flatMap(x=>x.tags))];
 $('#side').innerHTML=`${nav('hoy','today','Hoy',c.hoy)}${nav('man','tom','Mañana',c.man)}${nav('prox','week','Próximos 7 días',c.prox)}${nav('todas','all','Todas',c.todas)}${nav('plant','tpl','Plantillas',S.templates.length)}
 <div class="sh">Listas <button class="g" data-act="newlist" title="Nueva lista">${ic('plus',16)}</button></div>

const T={mode:'work',left:S.cfg.work*60,run:false,end:0,task:'',iv:null};
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);g.gain.value=.15;o.frequency.value=880;o.start();o.stop(c.currentTime+.5)}catch{}}
function setMode(m){stopT();T.mode=m;T.left=S.cfg[m]*60;renderMain()}
function stopT(){clearInterval(T.iv);T.run=false}
function startT(){
 if(T.run){stopT();updClock();return}
 T.run=true;T.end=Date.now()+T.left*1000;
 T.iv=setInterval(()=>{
  T.left=Math.max(0,Math.round((T.end-Date.now())/1000));
  if(T.left===0){
   stopT();beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);
   const was=T.mode;
   if(was==='work'){S.sess.push({d:today(),task:T.task,min:S.cfg.work});const x=S.tasks.find(z=>z.id===T.task);if(x){x.pomos++;x.spentS=(x.spentS||0)+S.cfg.work*60}save()}
   T.mode=was==='work'?'short':'work';T.left=S.cfg[T.mode]*60;
   render();setTimeout(()=>alert(was==='work'?'¡Sesión completada! Toma una pausa.':'Pausa terminada. ¡A trabajar!'),60);return;
  }
  updClock();
 },500);
 updClock();
}

// ---------- hábitos
const last=n=>[...Array(n)].map((_,i)=>addDays(today(),-(n-1)+i));
function streaks(h){
 let cur=0,d=today();if(!h.days.includes(d))d=addDays(d,-1);
 while(h.days.includes(d)){cur++;d=addDays(d,-1)}
 let best=0,run=0;[...new Set(h.days)].sort().forEach((s,i,a)=>{run=i&&addDays(a[i-1],1)===s?run+1:1;best=Math.max(best,run)});
 return {cur,best};
}

// ---------- tiempo real por tarea (cronómetro)
function fmtD(s){s=Math.max(0,Math.round(s));if(s<60)return s+' s';const m=Math.floor(s/60);return m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60)+' min'}
const spentNow=x=>(x.spentS||0)+(S.timer&&S.timer.id===x.id?Math.round((Date.now()-S.timer.start)/1000):0);
function tstop(){if(!S.timer)return;const x=S.tasks.find(z=>z.id===S.timer.id);if(x)x.spentS=(x.spentS||0)+Math.round((Date.now()-S.timer.start)/1000);S.timer=null;save()}
function tstart(id){tstop();S.timer={id,start:Date.now()};save()}

// ---------- recordatorios con hora
function remTarget(x){
 if(x.done||!x.due||!x.time||(x.rem??-1)<0||x.remDone)return null;
 if(x.snz)return x.snz;
 const d=pd(x.due),[h,m]=x.time.split(':').map(Number);d.setHours(h,m,0,0);
 return d.getTime()-x.rem*60000;
}
// Al fijar la hora, si el aviso ya quedó en el pasado no suena de golpe.
function armRem(x){x.remDone=false;x.snz=0;const t=remTarget(x);if(t!=null&&t<=Date.now())x.remDone=true}
function askNotif(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>{})}catch(e){}}
function checkRem(){
 const now=Date.now(),fired=[];
 S.tasks.forEach(x=>{const t=remTarget(x);if(t!=null&&now>=t){x.remDone=true;x.snz=0;fired.push(x)}});
 if(fired.length){save();fired.forEach(notifyTask);renderMain();renderSide()}
}
function remWhen(x){const r=x.rem||0;return r<=0?'ahora':r>=1440?'mañana':'en '+(r>=60?(r/60)+' h':r+' min')}
function notifyTask(x){
 showRemCard(x);sfx('alarm',true);
 if(navigator.vibrate)navigator.vibrate([250,120,250,120,250]);
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 const opts={body:(x.rem>0?'Empieza '+remWhen(x)+' · ':'')+(x.time||''),icon:'icon.svg',badge:'icon.svg',tag:'rem-'+x.id,vibrate:[250,120,250],requireInteraction:true,data:{id:x.id}};
 const fallback=()=>{try{new Notification('⏰ '+x.t,opts)}catch(e){}};
 if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification('⏰ '+x.t,opts)).catch(fallback);else fallback();
}
function showRemCard(x){
 let box=$('#rem');if(!box){box=document.createElement('div');box.id='rem';document.body.appendChild(box)}
 if(box.querySelector(`.remc[data-id="${x.id}"]`))return;
 const c=document.createElement('div');c.className='remc';c.dataset.id=x.id;
 c.innerHTML=`<b>⏰ ${esc(x.t)}</b><small>${esc(x.time||'')} · ${remWhen(x)==='ahora'?'es ahora':'empieza '+remWhen(x)}</small>
 <div class="row" style="margin-top:8px"><button data-act="remdone" data-id="${x.id}">Hecho</button><button class="o" data-act="remsnz" data-id="${x.id}">Posponer 10 min</button><button class="g" data-act="remx" data-id="${x.id}">Cerrar</button></div>`;
 box.appendChild(c);
}
function remClose(id){const c=document.querySelector(`.remc[data-id="${id}"]`);if(c)c.remove()}
// Calendario (.ics): el aviso lo da el calendario del teléfono, aunque Enfoque esté cerrada
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsDT(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'}
function icsFor(list){
 const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Enfoque//ES','CALSCALE:GREGORIAN'],stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
 list.forEach(x=>{
  const [h,m]=(x.time||'09:00').split(':').map(Number),s=pd(x.due);s.setHours(h,m,0,0);const e=new Date(s.getTime()+(x.est||30)*60000);
  L.push('BEGIN:VEVENT','UID:'+x.id+'@enfoque','DTSTAMP:'+stamp,'DTSTART:'+icsDT(s),'DTEND:'+icsDT(e),'SUMMARY:'+icsEsc(x.t));
  if(x.notes)L.push('DESCRIPTION:'+icsEsc(x.notes));
  const rr={d:'FREQ=DAILY',w:'FREQ=WEEKLY',wd:'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',m:'FREQ=MONTHLY',y:'FREQ=YEARLY'}[x.rep];if(rr)L.push('RRULE:'+rr);
  L.push('BEGIN:VALARM','TRIGGER:-PT'+Math.max(0,x.rem??0)+'M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(x.t),'END:VALARM','END:VEVENT');
 });
 L.push('END:VCALENDAR');return L.join('\r\n');
}
function icsDownload(list,name){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([icsFor(list)],{type:'text/calendar'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}

// ---------- dictado por voz
let rec=null;
function mic(btn,forId){
 if(!SR)return;
 if(rec){rec.stop();return}
 const inp=$('#'+forId);if(!inp)return;
 rec=new SR();rec.lang=/^es/i.test(navigator.language||'')?navigator.language:'es-ES';rec.interimResults=true;rec.continuous=false;

// ---------- sonidos de fondo (generados con Web Audio, sin archivos)
const SND={ctx:null,nodes:[],out:null,cur:'',boost:1};
function mkNoise(c,type){
 const n=c.sampleRate*6,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
 let l=0,b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
 for(let i=0;i<n;i++){
  const w=Math.random()*2-1;
  if(type==='marron'){l=(l+0.02*w)/1.02;d[i]=l*3.5}
  else if(type==='rosa'){b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
  else d[i]=w*.5;
 }
 return b;
}
function stopSound(){SND.nodes.forEach(n=>{try{if(n.stop)n.stop();n.disconnect()}catch(e){}});SND.nodes=[];SND.cur=''}
function playSound(k){
 stopSound();if(!k)return;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 if(!SND.ctx)SND.ctx=new AC();
 const c=SND.ctx;if(c.resume)c.resume();
 SND.boost={lluvia:1,olas:1.3,viento:2.5,blanco:.6,marron:.9}[k]||1;
 const out=c.createGain();out.gain.value=(S.cfg.vol??.5)*SND.boost;out.connect(c.destination);SND.out=out;
 const src=c.createBufferSource();src.loop=true;
 const nodes=[src,out];let last=src;
 const chain=(...ns)=>ns.forEach(n=>{last.connect(n);last=n;nodes.push(n)});
 const lfo=(freq,depth,param)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=depth;o.connect(g);g.connect(param);o.start();nodes.push(o,g)};
 const filt=(type,f,q)=>{const x=c.createBiquadFilter();x.type=type;x.frequency.value=f;if(q)x.Q.value=q;return x};
 if(k==='blanco'){src.buffer=mkNoise(c,'blanco');chain(out)}
 else if(k==='marron'){src.buffer=mkNoise(c,'marron');chain(out)}
 else if(k==='lluvia'){src.buffer=mkNoise(c,'rosa');chain(filt('highpass',500),filt('lowpass',8000),out)}
 else if(k==='olas'){src.buffer=mkNoise(c,'marron');const g=c.createGain();g.gain.value=.45;lfo(.12,.35,g.gain);chain(filt('lowpass',800),g,out)}
 else if(k==='viento'){src.buffer=mkNoise(c,'rosa');const bp=filt('bandpass',600,.7);lfo(.08,350,bp.frequency);chain(bp,out)}
 src.start();SND.nodes=nodes;SND.cur=k;
}
// efectos cortos: "ding" al completar, "pop" al añadir
// Se generan como archivos WAV y se reproducen con <audio>: suenan también en iPhone con el interruptor de silencio.
function wavUrl(a,rate){
 const n=a.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);
 const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,a[i]))*32767,true);
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}
function tone(notes,dur){
 const rate=22050,n=Math.floor(rate*dur),a=new Float32Array(n);
 notes.forEach(([f,t])=>{const s=Math.floor(t*rate);for(let i=s;i<n;i++){const x=(i-s)/rate;if(x>.5)break;const env=Math.min(1,x/.006)*Math.exp(-x*6);a[i]+=Math.sin(2*Math.PI*f*x)*env*.6+Math.sin(2*Math.PI*f*2*x)*env*.15}});
 return wavUrl(a,rate);
}
const SFX={};
function sfx(k,force){
 if(S.cfg.sfx===false&&!force)return;
 try{
  if(!SFX.done){SFX.done=new Audio(tone([[659.25,0],[880,.1],[1318.5,.2]],.75));SFX.add=new Audio(tone([[587.33,0],[783.99,.07]],.45));SFX.alarm=new Audio(tone([[880,0],[1108.7,.16],[880,.34],[1108.7,.5]],1.0))}
  const a=SFX[k];a.volume=1;a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});
 }catch(e){}
 if(k==='done'&&navigator.vibrate)navigator.vibrate(35);
}

function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='toast on';clearTimeout(toast.h);toast.h=setTimeout(()=>{t.className='toast'},2800)}
setInterval(()=>{const e=$('#rt');if(e){const x=S.tasks.find(z=>z.id===e.dataset.id);if(x)e.textContent=fmtD(spentNow(x))}},1000);
if(S.timer&&!S.tasks.some(z=>z.id===S.timer.id))S.timer=null;
setInterval(checkRem,15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkRem()});
setTimeout(checkRem,800);
if(navigator.serviceWorker)navigator.serviceWorker.addEventListener('message',e=>{const id=e.data&&e.data.open;if(id&&S.tasks.some(z=>z.id===id)){ui.view=ui.lastTV='todas';ui.sel=id;render();openTask(id)}});
document.documentElement.dataset.t=S.theme;
render();
// Compartir a Enfoque: llega por la dirección (?title=&text=&url=) cuando otra app comparte con la app instalada
(function(){
 const q=new URLSearchParams(location.search),ti=q.get('title')||'',tx=q.get('text')||'',u=q.get('url')||'',tid=q.get('task');
 if(tid){try{history.replaceState(null,'',location.pathname)}catch(e){}if(S.tasks.some(z=>z.id===tid)){ui.view=ui.lastTV='todas';ui.sel=tid;render();openTask(tid)}return}
 if(!(ti||tx||u))return;
 const body=[tx,u].filter(Boolean).join('\n').trim();let t=(ti||tx||u).split('\n')[0].trim();if(t.length>120)t=t.slice(0,117)+'…';
 const x={id:uid(),t,notes:body===t?'':body,list:'inbox',tags:[],p:0,due:'',rep:'',done:false,doneAt:null,subs:[],pomos:0,est:0,spentS:0};
 S.tasks.push(x);save();try{history.replaceState(null,'',location.pathname)}catch(e){}
 ui.view=ui.lastTV='todas';ui.sel=x.id;render();toast('Guardado desde Compartir: '+t);
})();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
